# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "ttrpgpbp"

[api]
port = 54321
# Extra schemas to add to the search_path of every request. public is always included.
schemas = ["public", "graphql_public"]
# Extra schemas to expose in PostgREST. public is always included.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[functions.push-notifications]
enabled = true
# Auth is done inside the function via a shared secret (x-push-secret header
# matched against push_notification_config). The DB trigger — not a browser — is
# now the only caller, so platform JWT verification is off.
verify_jwt = false
import_map = "./functions/push-notifications/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/push-notifications/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML files in your function:
# static_files = [ "./functions/push-notifications/*.html" ]

[functions.cleanup-images]
enabled = true
# Scheduled-only function (see DEPLOYMENT.md). Scheduler authenticates with the
# CLEANUP_IMAGES_SECRET header; no-op while app_settings.image_retention_days is 0.
verify_jwt = false

[functions.upload-image]
enabled = true
# Browser-invoked with the user's JWT. The function resolves identity from that
# token and enforces GM-of-channel for channel uploads or self-ownership for
# profile uploads itself (it stores with the service role), so it never trusts
# the request body for authorization.
verify_jwt = true
entrypoint = "./functions/upload-image/index.ts"

[functions.delete-account]
enabled = true
# Browser-invoked with the user's JWT (GDPR erasure). verify_jwt stays at the
# platform default (true); the function resolves the user from the token.
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

# The app signs in with redirectTo = window.location.origin (Google OAuth) and
# with <origin>/login?redirect=<path> for email magic links, so every origin
# the app is served from must be allowed here. Applied to the hosted project
# via `supabase config push` (or the dashboard's Auth → URL Configuration).
# site_url is the fallback for auth emails that pass no explicit redirect; the
# app's own flows always pass one, so local development is unaffected.
[auth]
site_url = "https://rolebypost.com"
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "https://ttrpgpbp.pages.dev",
  "https://ttrpgpbp.pages.dev/**",
  "https://*.ttrpgpbp.pages.dev/**",
  "https://rolebypost.com",
  "https://rolebypost.com/**",
]

[auth.external.google]
enabled = true
client_id = "874851725148-ti03e8gh6mjmc5j3ddt57tku9upcm6oj.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# Passwordless email sign-in (#205). The hosted project had the email provider
# disabled (Google-only), which blocks magic links entirely. enable_signup also
# lets first-time users register through a link, matching the Google flow.
[auth.email]
enable_signup = true
