<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('rolebypost-theme') } catch (e) {}
        var dark = saved === 'dark'
          || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#111827' : '#f9fafb')
      })()
    </script>
    <script>
      // Hide the prerendered landing before first paint when a Supabase session
      // is already persisted, so a signed-in visitor reloading `/` never sees
      // the marketing page flash before the lobby loads (issue #658). Scoped to
      // `/`: every other public page's prerendered content is correct for
      // signed-in visitors too and must not be hidden or discarded. Keep this
      // key pattern in sync with src/lib/authSessionHint.ts.
      (function () {
        try {
          if (location.pathname !== '/') return
          var hasSession = false
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i)
            if (key && /^sb-.*-auth-token(\.\d+)?$/.test(key)) { hasSession = true; break }
          }
          if (hasSession) document.documentElement.setAttribute('data-auth-pending', '')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
