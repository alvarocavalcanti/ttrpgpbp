name: Apply Migrations

on:
  push:
    branches: [ main ]
  # Manual trigger so a branch's pending migrations can be applied to the
  # remote project before merge (e.g. to test a schema change on a PR preview,
  # which points at the shared remote database).
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.117.0
          
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          
      - name: Push migrations to Supabase
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy edge functions
        run: |
          supabase functions deploy push-notifications --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy cleanup-images --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy upload-image --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
