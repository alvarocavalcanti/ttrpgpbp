name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link` (api-keys inserted_at schema bug, supabase/cli#6115). Re-pin once fixed.
          version: v2.111.0

      - name: Start local Supabase & apply migrations
        run: supabase db start

      - name: Verify migrations apply from scratch
        run: supabase db reset

      - name: Run database regression tests
        run: supabase test db --local

  test:
    needs: migrate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck
        
      - name: Markdown lint
        run: npm run lint:md
        
      - name: Type check
        run: npm run build
        
      - name: Run tests with coverage
        run: npm run test:coverage
