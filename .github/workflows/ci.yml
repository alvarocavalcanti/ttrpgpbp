name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link` (api-keys inserted_at schema bug, supabase/cli#6115). Re-pin once fixed.
          version: v2.111.0

      - name: Start local Supabase & apply migrations
        run: supabase db start

      - name: Verify migrations apply from scratch
        run: supabase db reset

      - name: Run database regression tests
        run: supabase test db --local

      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --local > src/types/database.ts
          git diff --exit-code src/types/database.ts || (echo "Types drift detected. Run 'supabase gen types typescript --local > src/types/database.ts' locally and commit the result." && exit 1)

  test:
    needs: migrate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link`. Re-pin once fixed.
          version: v2.111.0

      - name: Start local Supabase
        run: supabase db start

      - name: Generate .env.local from Supabase config
        run: |
          supabase status -o env | grep -E "API_URL|ANON_KEY" | sed 's/API_URL/VITE_SUPABASE_URL/' | sed 's/ANON_KEY/VITE_SUPABASE_ANON_KEY/' > .env.local
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck
        
      - name: Markdown lint
        run: npm run lint:md
        
      - name: Type check
        run: npm run build
        
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run Playwright tests
        run: npx playwright test
