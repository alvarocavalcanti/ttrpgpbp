name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link` (api-keys inserted_at schema bug, supabase/cli#6115). Re-pin once fixed.
          version: v2.111.0

      - name: Start local Supabase & apply migrations
        run: supabase db start

      - name: Verify migrations apply from scratch
        run: supabase db reset

      - name: Run database regression tests
        run: supabase test db --local

      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --local > src/types/database.ts
          git diff --exit-code src/types/database.ts || (echo "Types drift detected. Run 'supabase gen types typescript --local > src/types/database.ts' locally and commit the result." && exit 1)

  test:
    needs: migrate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link`. Re-pin once fixed.
          version: v2.111.0

      - name: Start local Supabase
        run: supabase db start

      - name: Generate .env.local from Supabase config
        run: |
          supabase status -o env | grep -E "API_URL|ANON_KEY" | sed 's/API_URL/VITE_SUPABASE_URL/' | sed 's/ANON_KEY/VITE_SUPABASE_ANON_KEY/' > .env.local
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck
        
      - name: Markdown lint
        run: npm run lint:md
        
      - name: Type check
        run: npm run build
        
      - name: Run tests with coverage
        run: npm run test:coverage

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # ponytail: pin v2.111.0 — v2.112.0+ breaks `supabase link`. Re-pin once fixed.
          version: v2.111.0

      # Full local stack (auth + REST + realtime), not `db start` — the E2E
      # specs need the auth API and are skipped (not run) without it, which
      # used to make the Playwright step a no-op in CI (issue #403 ARCH-7).
      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      # The specs skip themselves when Supabase is unreachable; fail loudly
      # here instead so a broken stack can't masquerade as a green job.
      - name: Verify auth API is serving
        run: curl -sf http://127.0.0.1:54321/auth/v1/health

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env.local from Supabase config
        run: |
          supabase status -o env | grep -E "API_URL|ANON_KEY" | sed 's/API_URL/VITE_SUPABASE_URL/' | sed 's/ANON_KEY/VITE_SUPABASE_ANON_KEY/' > .env.local

      - name: Export Supabase env for E2E seeding
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
