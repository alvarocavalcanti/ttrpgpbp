# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # Bundle routine minor/patch bumps into one PR per dependency type;
      # majors still arrive individually so breaking changes get reviewed.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # vitest and its coverage provider must bump majors together (a
      # coverage-v8 major can't run against vitest from the previous line)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moved the PostCSS plugin into @tailwindcss/postcss and
      # changed the config/directive syntax — a breaking migration we do by
      # hand when ready, not a version bump dependabot can land green.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
